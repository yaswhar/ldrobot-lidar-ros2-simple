# ldlidar_node/params/ldlidar.yaml

/**:
  ros__parameters:
    general:
      debug_mode: true # true to activate debug messages

    comm:
      serial_port: '/dev/ttyUSB0' # serial port name (change to /dev/ttyUSB1 if needed)
      baudrate: 921600 # serial baudrate for LDLiDAR_LD19: 230400. Serial baudrate for LDLiDAR_STL27L: 921600
      timeout_msec: 1000 # data communication timeout in msec

    lidar:
      model: 'LDLiDAR_STL27L' # Model type: LDLiDAR_LD06, LDLiDAR_LD19, LDLiDAR_STL27L
      rot_verse: 'CW' # 'CW' -> `CLOCKWISE` / 'CCW' -> `COUNTERCLOCKWISE` [ROS STANDARD]
      units: 'M' # 'MM' -> `MILLIMETERS` / 'CM' -> `CENTIMETERS` / 'M' -> `METERS` [ROS STANDARD]
      frame_id: 'ldlidar_link' # TF frame name for the lidar
      bins: 455 # set to 0 for dynamic scan size according to rotation speed, set to a fixed value [e.g. 455] for compatibility with SLAM Toolbox
      range_min: 0.03 # Minimum distance in 'units'
      range_max: 2.0 # Maximum distance in 'units'
      enable_angle_crop: true # enable angle cropping
      angle_crop_min: 240.0 # minimum angle for cropping
      angle_crop_max: 300.0 # maximum angle for cropping
      scan_topic: '/ldlidar_node/scan' # Topic to subscribe for laser scan data
      drone_velocity: 0.2 # Drone velocity in meters per second (m/s) - controls spatial resolution
      elevation_angle: 0.0 # Pitch angle in degrees (negative=nose-down for ground scanning, positive=nose-up)

ldlidar_stats_publisher:
  ros__parameters:
    update_rate: 10.0 # Statistics computation rate in Hz (1.0 = every second)

ldlidar_stats_logger:
  ros__parameters:
    log_file_path: '~/shahrokhi' # Directory path to save statistics log files (use Docker mount path)
    max_display_lines: 500 # Maximum lines to display in GUI window

ground_mapper:
  ros__parameters:
    map_buffer_time: 30.0 # Seconds of scan data to keep in buffer
    update_rate: 10.0 # Visualization update rate (Hz)
    point_size: 3.0 # Point size for scatter plot visualization
    colormap: 'jet_r' # Matplotlib colormap (jet_r, viridis, hot, cool)

ground_mapper_logger:
  ros__parameters:
    log_output_dir: '~/shahrokhi/ground_logs' # Directory to save log files
    log_interval: 0.1 # Log interval in seconds (10 Hz)
