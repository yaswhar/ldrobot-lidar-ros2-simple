# ldlidar_node/params/oscillation_planner.yaml
#
# MOTION-PLANNING config for oscillation_planner_node.
# Owns: mechanism geometry, elliptical trajectory, IK lookup-table grid, per-lap
# timing, torque model. NOTHING about DynamixelSDK / motor IDs / ticks lives here.

/**:
  ros__parameters:
    # --- mechanism geometry (baseline design point, metres) ---
    geometry:
      a: 0.11
      b: 0.44
      c: 0.77
      d: 0.10

    # --- elliptical trajectory (step 2) ---
    # Single continuous closed curve in (h, gamma):
    #   h(phi)     = h_mid + (stroke/2) cos(phi),  h_mid=(h_high+h_low)/2
    #   gamma(phi) = gamma_amplitude_deg * sin(phi)
    # h_high/h_low are reached only at gamma=0; the tilt extremes occur at h_mid,
    # so the path stays inside the achievable envelope (which narrows toward
    # h_mid as |gamma| grows) by construction.
    trajectory:
      h_high: 1.18                 # m  (top of stroke, at gamma=0)
      h_low: 0.68                  # m  (bottom of stroke, at gamma=0)
      gamma_amplitude_deg: 30.0    # tilt amplitude (at h_mid)

    # --- laps: repeat the full ellipse loop N times, each independently timed ---
    # One entry per lap (default 3 laps: slow/medium/fast). The ellipse adds a
    # full tilt oscillation the old monotonic leg lacked, so the side links see
    # ~1.5x the inertial load; the fast lap (7.0s) sits comfortably under the
    # 90%-stall gate. A lap that fails the gate is auto-slowed (loud warning) to
    # the fastest duration that passes.
    lap_durations_s: [12.0, 9.0, 7.0]

    # --- inverse-kinematics lookup table (step 3) ---
    # Built OFFLINE by generate_ik_lut.py (or on first node startup) and cached to
    # disk; the runtime loop only interpolates it (O(1), deterministic).
    lut:
      h_step_m: 0.005              # 5 mm grid in h
      gamma_step_deg: 1.0          # 1 deg grid in gamma
      gamma_amp_deg: 30.0          # table covers gamma in [-amp, +amp]
      cache_path: '~/.cache/ldlidar_platform/ik_lut.npz'
      force_rebuild: false         # true to ignore/overwrite the cache

    # --- streaming / firmware motion profile ---
    control_rate_hz: 50.0          # waypoint stream rate (also the lap resolution)
    start_settle_s: 3.0            # creep-to-start hold before the first lap
    creep_velocity_rad_s: 0.15     # slow speed for the creep-to-start move
    min_profile_velocity_rad_s: 0.05  # floor (0 would mean "unlimited" in firmware)
    max_profile_velocity_rad_s: 6.0   # cap on the per-waypoint profile velocity

    # --- torque / feasibility model ---
    gear_ratio: 1.0                 # motor:joint reduction (1.0 = direct drive)
    gravity_torque_fraction: 0.5    # fraction of the anchored 1.07 N.m peak that
                                    # is gravity (T-independent); the rest is the
                                    # inertial term (scales with joint accel).

    # --- topics ---
    goal_topic: '/joint_goal'
    state_topic: '/joint_states'
