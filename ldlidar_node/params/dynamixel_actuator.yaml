# ldlidar_node/params/dynamixel_actuator.yaml
#
# HARDWARE-LAYER config for dynamixel_actuator_node.
# Owns: port, baud, logical->physical motor mapping (id/direction), the GEARBOX
# model, control mode + cascade tuning, soft limits, load cutoff. Calibration
# zero lives in each motor's EEPROM Homing Offset (set by dynamixel_calibrate.py),
# NOT here. NOTHING mechanism-specific here.

/**:
  ros__parameters:
    # --- serial link (prefer a stable /dev/serial/by-id/... path so it does
    #     not collide with the LIDAR's /dev/ttyUSB0 on the same Pi) ---
    port: '/dev/ttyUSB0'
    baudrate: 1000000        # FIXED: all 4 servos are at 1M (bench-measured)
    protocol_version: 2.0    # DYNAMIXEL Protocol 2.0 (TTL)
    auto_probe_baud: false   # connect directly at 1M; no multi-baud probe on
                             # launch. Use `find_servos.py --scan` to diagnose.

    # --- GEARBOX between each motor and its crank (fitted 2026-09) ---
    # Single-stage cycloidal reducer, 8 ring pins / 7 lobes -> 7:1, REVERSING
    # (output turns opposite to input). See gearbox/cycloid_review.py.
    # NOTE the servos were RE-MOUNTED with the reducers, which flipped their own
    # shaft sense (see motors.*.directions); the reducer's reversal is a separate
    # fact and stays true. Only the product direction x gear_sign (= -1) reaches
    # the runtime, and it was measured on 2026-09-22 (see calibration below).
    #   motor_deg = gear_sign * ratio * joint_deg    (gear_sign = -1 if reversing)
    #   motor rad/s (and rad/s^2) = ratio * joint rad/s
    #   joint N.m = motor N.m * ratio * efficiency
    # `directions` below stay the MEASURED sense of the motor itself; the gear
    # sign is applied separately so re-running the calibrator stays truthful.
    # ratio 1.0 / reversing false / efficiency 1.0 = the old direct-drive build.
    gear:
      ratio: 7.0
      reversing: true
      efficiency: 0.88       # assumed for the cycloid -- MEASURE it (kickoff 1)

    motor:
      stall_torque_nm: 1.5   # XC430-W150-T; only used to turn Present Load into N.m

    # --- logical joint -> physical motor mapping ---
    # "theta" is TWO motors (IDs 1 & 2); alpha/beta are single motors.
    # directions = the raw-tick sense of the motor's OWN output shaft in the
    # mechanism's positive-angle sense. Direct-drive build (2026-08): -1 on all
    # four. 2026-09-22: the servos were re-mounted with the reducers, facing the
    # other way, so all four are now +1; through the reversing cycloid the
    # joint-vs-tick sense is (+1)(-1) = -1: raw ticks DECREASE as the joint
    # rises (measured: ID1 230 -> 615 motor deg for joint 85 -> 30).
    # Per-motor zero is handled by EEPROM Homing Offset, so the two theta motors
    # receive IDENTICAL goal ticks after calibration.
    # raw_offsets_ticks = raw single-turn ticks at joint 0 deg implied by the
    # 2026-09-22 calibration; used ONLY for the startup sanity log.
    motors:
      theta:
        ids: [1, 2]
        directions: [1, 1]
        raw_offsets_ticks: [1195, 171]   # reference only (startup log)
      alpha:
        ids: [3]
        directions: [1]
        raw_offsets_ticks: [626]         # reference only (startup log)
      beta:
        ids: [4]
        directions: [1]
        raw_offsets_ticks: [3300]        # reference only (startup log)

    # --- per-logical-joint soft angle limits (JOINT / output deg) -- SAFETY BACKSTOP
    # Enforced on EVERY goal regardless of what a (future lidar) planner asks; in
    # velocity mode also as a direction clamp on the MEASURED angle. Kept wider
    # than the elliptical trajectory (theta 2.8..73.3 deg, alpha/beta ~1.7..73.2)
    # so the real motion is never clamped.
    # 2026-09-16: range of motion set to 30..85 deg on every joint. The planner's
    # h_low was raised to 0.92 m to match (the old 0.65 m ellipse reached ~2 deg
    # and would be clamped flat at 30). 30..85 deg joint = 210..595 deg motor.
    limits:
      theta: {min_deg: 30.0, max_deg: 85.0}
      alpha: {min_deg: 30.0, max_deg: 85.0}
      beta:  {min_deg: 30.0, max_deg: 85.0}

    # --- startup revolution-safety check ---
    # The multi-turn count is RAM: on power-up (and on an Operating Mode change)
    # each motor only knows its angle modulo one MOTOR revolution = 360/7 = 51.4
    # JOINT deg. The soft-limit band (+ margin) spans ~2 motor revs, so a raw
    # reading usually has 2 candidate joint angles and the node REFUSES TO START
    # unless a pose hint picks exactly one (within the tolerance). Hint sources,
    # in order:
    #   1. expected_pose_deg.<joint> (NaN = not given) -- for when you KNOW where
    #      the platform is (measured, or just calibrated there);
    #   2. pose_file -- the joint pose this node (or the calibrator / jog tool)
    #      last recorded. The cycloid does not back-drive, so the platform stays
    #      where it was switched off; the file is trusted only if the motors'
    #      EEPROM Homing Offsets still match the ones it was written under.
    # !! Any hint must be TRUE. If the platform was moved by something that did
    #    not update the file (Dynamixel Wizard, a stalled run), pass the measured
    #    pose in expected_pose_deg instead. The chosen interpretation is logged:
    #    check it against the crank BEFORE the first goal.
    startup:
      plausible_margin_deg: 22.5       # joint deg outside the soft limits still "plausible"
      expected_pose_deg: {theta: .nan, alpha: .nan, beta: .nan}
      pose_file: '~/.cache/ldlidar_platform/last_pose.yaml'   # '' disables
      pose_hint_tolerance_deg: 8.0     # must be << 51.4/2; a stale file 51 +/- 8 deg
                                       # off would pick the WRONG candidate

    # --- control mode ---
    # position : Extended Position Control (op mode 4), servo closes the loop.
    #            Profile velocity/acceleration are now GEAR-SCALED (kickoff
    #            Step 0). Run this FIRST after re-gearing: if the wobble is
    #            gone, position mode is fine.
    # velocity : Velocity Control (op mode 1) with the position loop closed in
    #            this node (P/PI + planner feed-forward). Watchdog, tracking
    #            trip and direction-aware soft limits are active. NOTE the
    #            softer hold at rest (kickoff section 4 drop hazard).
    control:
      mode: 'position'                 # 'position' | 'velocity'
      rate_hz: 50.0                    # velocity-mode loop (read+control+write)
      kp: 6.0                          # 1/s, joint position error -> joint rad/s
      ki: 0.0                          # 1/s^2 (0 = pure P + feed-forward)
      integral_limit_rad_s: 0.2        # anti-windup clamp on the I term's output
      deadband_deg: 0.15               # ~12 joint ticks at 7:1; no hunting at rest
      catchup_rate_rad_s: 0.3          # cap on the P/I CORRECTION (feed-forward is uncapped
                                       # up to velocity_limit): a goal jump is closed at this
                                       # rate while the stream is still followed
      velocity_limit_rad_s: 1.0        # JOINT side (= 66.8 rpm motor at 7:1, < 70 no-load)
      watchdog_timeout_s: 0.1          # stale /joint_goal -> zero velocity (5 periods at 50 Hz)
      max_tracking_error_deg: 12.0     # -> torque off + latch when the error is NOT closing
      tracking_fault_persist: 5        # consecutive periods over the limit and not closing
      goal_jump_warn_deg: 5.0          # a goal discontinuity is logged (never a fault, never a re-creep)
      creep_done_deg: 1.0
      creep_timeout_s: 40.0            # creep not converging -> fault (wrong sign?)
      velocity_mode_profile_accel_rad_s2: 0.0   # joint side; 0 = firmware "no profile"

    # --- motion profiles (position mode; JOINT side, gear-scaled before writing) ---
    default_profile_velocity_rad_s: 0.6   # used when a goal omits velocity
    profile_acceleration_rad_s2: 3.0
    creep_profile_velocity_rad_s: 0.15    # slow "creep to first pose" speed (both modes)

    # --- independent Present-Load cutoff (second line of defence) ---
    # reg 126 is PRESENT LOAD (0.1 %/unit, 100 % ~ stall); the XC430 has no
    # current sensor and no Current Limit register. Set the trip in JOINT N.m
    # (converted with gear.ratio x gear.efficiency; the node applies no extra
    # coupling loss, so its joint estimate is conservative):
    #   6.0 N.m joint = 0.974 N.m motor at 7:1 x 0.88 = 65 % load (649 units)
    #   = 1.4x the 2.5 kg lap peak (4.3 N.m), 3.4x the 0.5 kg peak (1.8 N.m),
    #   ~14.5 MPa crank bending (84 % of the 17.3 MPa HDPE allowable).
    # The legacy motor-side current_limit_ma=1200 (44.6 % load) would be only
    # 4.1 N.m joint at 7:1 -- BELOW the 2.5 kg lap peak of 4.3 -- see
    # diagnostics/gear_check.py. It is used only if joint_torque_nm is 0.
    load_cutoff:
      joint_torque_nm: 6.0
    current_limit_ma: 1200.0              # LEGACY fallback (motor side)
    current_fault_persist: 5              # consecutive over-limit reads to trip

    # --- calibration (used by dynamixel_calibrate.py; the actuator node ignores
    #     these -- runtime zero lives in each motor's EEPROM Homing Offset).
    # FROM-PARAMS mode (default): motor-side Present Position in degrees, read
    # with Homing Offset = 0 (Dynamixel Wizard), at the two ends of the range,
    # measured 2026-09-22. The calibrator verifies each span = 7 x (85 - 30) =
    # 385 deg and one common sense, checks it against directions x gear.reversing,
    # writes the Homing Offsets so Present == ticks(joint) and asks where the
    # platform is now (for the startup pose file). Nothing moves.
    # Re-measure after ANY change to the motor/reducer/crank coupling.
    calibration:
      joint_at_max_deg: 85.0            # the "h_max" pose = joint 85 deg (platform up)
      joint_at_min_deg: 30.0            # the "h_min" pose = joint 30 deg (platform down)
      motor_deg_at_max: {'1': 230.0, '2': 500.0, '3': 180.0, '4': 415.0}
      motor_deg_at_min: {'1': 615.0, '2': 885.0, '3': 565.0, '4': 800.0}
      reference_deg: {theta: 0.0, alpha: 0.0, beta: 0.0}  # only for `cap ref` in --jog mode
      offsets_file: '~/dynamixel_offsets.yaml'            # record output path

    # --- timing / topics / logging ---
    state_publish_rate_hz: 20.0           # position mode; velocity mode publishes at control.rate_hz
    log:
      load_snapshot_period_s: 0.5         # reg[126] ground-truth line; 0 = off. Console writes are
                                          # synchronous -- on a slow terminal they stall the cascade
    goal_topic: '/joint_goal'
    state_topic: '/joint_states'
