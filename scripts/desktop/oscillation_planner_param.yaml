# /home/mohammad/Desktop/oscillation_planner_param.yaml
# (desktop copy of ldlidar_node/params/oscillation_planner.yaml -- edit here, no
#  rebuild needed; run_dynamixel.sh passes it as planner_params_file:=)
#
# MOTION-PLANNING config for oscillation_planner_node.
# Owns: mechanism geometry, elliptical trajectory, IK lookup-table grid, per-lap
# timing, torque gate (link masses, motor catalog, gearbox ratio/efficiency).
# NOTHING about DynamixelSDK / motor IDs / ticks lives here.

/**:
  ros__parameters:
    # --- mechanism geometry (baseline design point, metres) ---
    geometry:
      a: 0.11
      b: 0.44
      c: 0.77
      d: 0.10

    # --- elliptical trajectory (step 2) ---
    # Single continuous closed curve in (h, gamma):
    #   h(phi)     = h_mid + (stroke/2) cos(phi),  h_mid=(h_high+h_low)/2
    #   gamma(phi) = gamma_amplitude_deg * sin(phi)
    # h_high/h_low are reached only at gamma=0; the tilt extremes occur at h_mid,
    # so the path stays inside the achievable envelope (which narrows toward
    # h_mid as |gamma| grows) by construction.
    trajectory:
      h_high: 1.18                 # m  (top of stroke, at gamma=0). Kept 30 mm
                                   #     below the 1.210 m ceiling, where dh/dtheta
                                   #     collapses (a real singularity) -- leave it.
      h_low: 0.92                  # m  (bottom of stroke, at gamma=0).
                                   #     2026-09-16: raised from 0.65 so every joint
                                   #     stays >= 30 deg over the whole ellipse (the
                                   #     actuator's new soft-limit floor): at 0.92 the
                                   #     minimum joint angles are theta 33.8, alpha/
                                   #     beta 32.9 deg; at 0.90 they touch 30.6. The
                                   #     geometric floor is still 0.635 m (alpha/beta
                                   #     binding, ~2 deg) -- set 0.65 to get the old
                                   #     0.53 m stroke back if the limits are widened.
      gamma_amplitude_deg: 30.0    # tilt amplitude (at h_mid)

    # --- laps: repeat the full ellipse loop N times, each independently timed ---
    # One entry per lap (default 3 laps: slow/medium/fast). Each lap is gated by
    # the verified statics + inertia model through the gearbox (see gear/motor/
    # dynamics below): at 7:1 with the 0.5 kg field payload the 7 s lap sits at
    # ~22 % of stall / 29 % of rated; with the 2.5 kg design payload ~52 % / 74 %
    # (diagnostics/gear_check.py). A lap that fails is auto-slowed (loud warning)
    # to the fastest duration that passes; one whose STATIC holding torque alone
    # fails is refused outright.
    lap_durations_s: [30.0, 30.0, 30.0]   # desktop: the slow 30 s laps you were running; package default is [12, 9, 7]

    # --- inverse-kinematics lookup table (step 3) ---
    # Built OFFLINE by generate_ik_lut.py (or on first node startup) and cached to
    # disk; the runtime loop only interpolates it (O(1), deterministic). Angles
    # are quantized onto the JOINT-side encoder lattice 4096 x gear.ratio per
    # rev (0.01256 deg at 7:1); the cache signature includes the ratio.
    lut:
      h_step_m: 0.005              # 5 mm grid in h
      gamma_step_deg: 1.0          # 1 deg grid in gamma
      gamma_amp_deg: 30.0          # table covers gamma in [-amp, +amp]
      cache_path: '~/.cache/ldlidar_platform/ik_lut.npz'
      force_rebuild: false         # true to ignore/overwrite the cache

    # --- streaming / firmware motion profile ---
    control_rate_hz: 50.0          # waypoint stream rate (also the lap resolution)
    start_settle_s: 3.0            # MIN creep-to-start time before the first lap...
    start_arrival_tol_deg: 0.75    # ...then wait until /joint_states is this close
                                   #    (tighter than the actuator's creep_done_deg 1.0)
    start_timeout_s: 30.0          # ...but start anyway (warning) after this long
    creep_velocity_rad_s: 0.15     # LEGACY, unused: the creep-to-start speed is the
                                   # actuator's creep_profile_velocity_rad_s; the planner
                                   # publishes v=0 for the held start pose
    min_profile_velocity_rad_s: 0.05  # floor on |v| (0 would mean "unlimited" in firmware)
    max_profile_velocity_rad_s: 6.0   # cap on |v| per waypoint (joint side)

    # --- gearbox (7:1 cycloid fitted 2026-09; the ONLY hardware facts here) ---
    # Needed for the torque gate and for the LUT's joint-side encoder lattice.
    # Must match dynamixel_actuator.yaml gear.ratio / gear.efficiency.
    gear:
      ratio: 7.0
      efficiency: 0.88

    # --- motor catalog (XC430-W150-T, motor side) ---
    motor:
      stall_torque_nm: 1.5
      rated_torque_nm: 0.83
      no_load_rpm: 70.0
      efficiency: 0.9              # joint->shaft coupling loss (redesign_report.md basis)

    # --- link masses / inertias for the torque gate (motor_selection/config.json)
    # m1 = coupler (c), m2 = crank (b), M + m3 = hanging load under plate d.
    # These are the 0.5 kg FIELD payload of 2026-08-28 (M 0.2 + plate 0.3).
    # For the 2.5 kg design case set M: 2.2. Gate against what is bolted on.
    dynamics:
      m1: 0.1427
      m2: 0.1442
      m3: 0.3
      M: 0.2
      J1: 0.00705
      J2: 0.00233
      g: 9.81
      b_damp: 0.5
      k_stiff: 0.01

    # --- topics ---
    goal_topic: '/joint_goal'
    state_topic: '/joint_states'
